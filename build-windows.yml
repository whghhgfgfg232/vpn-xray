name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - '.github/workflows/build-windows.yml'
      - 'third_party/xray/**'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\XrayQtClient.exe release\ -Force

          if (Test-Path third_party\xray\xray.exe) {
            New-Item -ItemType Directory -Force -Path release\third_party\xray | Out-Null
            Copy-Item third_party\xray\xray.exe release\third_party\xray\xray.exe -Force
          }

          windeployqt --release --compiler-runtime release\XrayQtClient.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayQtClient-Windows-Release
          path: release/**
